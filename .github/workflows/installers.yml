# Builds this fork's installers (Windows MSI and macOS DMG) and publishes them as a GitHub Release.
#
# Push a tag such as `v0.8.1` and this runs: it builds both installers, writes SHA256SUMS.txt and
# creates a release with everything. The app's own update check (apps/pdfcraft/src/updates.rs)
# reads the latest release of this repository, downloads the Windows installer and refuses to run
# it unless its SHA-256 matches the checksum file.
#
# The tag is the version: X.Y.Z with the major.minor of Cargo.toml (0.8.1, 0.8.2, ...), and larger
# than the version already installed, or Windows Installer won't treat the MSI as an upgrade. The
# workflow stamps it into the build with `cargo xtask version set`, so no commit is needed to bump
# a version.
#
# Run by hand (Actions ▸ Installers ▸ Run workflow) to build without publishing: the
# installers are kept as workflow artifacts.
#
# Nothing here is signed: there is no Windows certificate (SmartScreen warns on first install) and
# no Apple Developer ID (the Mac app is ad-hoc signed and not notarized, so macOS asks you to
# approve it the first time: right-click ▸ Open).
name: Installers

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build, X.Y.Z with Cargo.toml's major.minor (empty: Cargo.toml's own). Nothing is published"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The version Cargo.toml declares now. The workspace crates require `^<major>.<minor>.0`
          # of each other, so a release must keep that major.minor (0.8.1, 0.8.2, ...).
          current=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION:-$current}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the version must be X.Y.Z (got '$v')"; exit 1
          fi
          if [ "${v%.*}" != "${current%.*}" ]; then
            echo "::error::version $v must keep the major.minor of Cargo.toml (${current%.*}.N), because the crates require ^${current%.*}.0 of each other"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-release-x64

      - name: Stamp the version
        shell: bash
        run: cargo xtask version set "${{ needs.version.outputs.version }}"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"

      # Unsigned: sign.ps1 skips signing, with a warning, when no certificate is configured.
      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-release-universal

      - name: Stamp the version
        run: cargo xtask version set "${{ needs.version.outputs.version }}"

      # No MACOS_SIGN_IDENTITY: package.sh signs ad-hoc and skips notarization, with a warning.
      - name: Build and package
        run: packaging/macos/package.sh --arch universal

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        working-directory: artifacts
        run: |
          ls -l
          test -n "$(ls ./*.msi 2>/dev/null)" || { echo "::error::no MSI was built"; exit 1; }
          test -n "$(ls ./*.dmg 2>/dev/null)" || { echo "::error::no DMG was built"; exit 1; }
          # "<hash>  <name>", one per file; the app's updater reads exactly this format.
          sha256sum ./*.msi ./*.dmg ./*.zip | sed 's#\( [ *]\)\./#\1#' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PdfCraft $VERSION" \
            --notes "Installers for this fork. Windows: run the .msi, which updates an installed PdfCraft in place and keeps its settings (unsigned: SmartScreen may warn). Mac: open the .dmg and drag PdfCraft to Applications (not notarized: the first time, right-click the app and choose Open). Checksums are in SHA256SUMS.txt." \
            ./*.msi ./*.dmg ./*.zip SHA256SUMS.txt
